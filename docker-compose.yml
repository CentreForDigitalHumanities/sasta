services:
  alpino:
    image: registry.webhosting.rug.nl/compling/alpino:latest
    platform: linux/amd64
    command: Alpino -notk -veryfast user_max=600000 server_kind=parse server_port=7001 assume_input_is_tokenized=off end_hook=xml -init_dict_p batch_command=alpino_server
    healthcheck:
      # Wait for Alpino (can be slow)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/7001"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  db:
    image: postgres:17
    environment:
      - POSTGRES_DB=sasta
      - POSTGRES_USER=sasta
      - POSTGRES_PASSWORD=sasta
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sasta -d sasta"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    image: &backend sasta-backend
    volumes:
      - type: bind
        source: ./backend
        target: /app
      - static_data:/app/static
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      alpino:
        condition: service_healthy
    env_file: &envfile
      - ./.env.dev
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    build:
      context: ./frontend
    volumes:
      - type: bind
        source: ./frontend/src
        target: /app/src
      - type: bind
        source: ./package.json
        target: /package.json
        read_only: true
    command: sh -c "yarn prebuild && ng serve --host 0.0.0.0"

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/static
    depends_on:
      - backend
      - frontend
    ports:
      - 80:80

  worker:
    build:
      context: ./backend
    image: *backend
    restart: "no"
    env_file: *envfile
    entrypoint: []
    command: ["celery", "--app=sasta.celery.app", "worker", "--concurrency=1", "--hostname=worker@%h", "--loglevel=INFO"]
    volumes:
      - type: bind
        source: ./backend
        target: /app
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_started
      alpino:
        condition: service_healthy

  redis:
    image: redis:7
    restart: on-failure


volumes:
  postgres_data:
  static_data:
