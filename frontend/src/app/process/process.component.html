@if (corpus) {
    <h1 class="title">{{corpus.name}}</h1>
    <h2 class="subtitle">{{corpus.transcripts.length}} transcripts</h2>
    <!-- <p-steps [model]="stepsItems" [activeIndex]="stepsIndex"></p-steps> -->
    <div class="buttons">
        <button class="button is-primary" [ngClass]=" {'is-loading': processing}" (click)="fullProcess()">
            <span class="icon is-small">
                <fa-icon [icon]="faCogs"></fa-icon>
            </span>
            <span>process</span>
        </button>
        <button class="button is-primary" [routerLink]="['/corpora/', corpus.id]">
            <span class="icon is-small">
                <fa-icon [icon]="faArrowRight"></fa-icon>
            </span>
            <span>to corpus</span>
        </button>
    </div>
    <table class="table">
        <tbody>
            <tr>
                <th>Transcript</th>
                <th>Status</th>
                <th>Convert</th>
                <th>Parse</th>
            </tr>
            @for (transcript of corpus.transcripts; track transcript.id) {
                <tr sas-transcript-progress [transcript]="transcript"></tr>
            }
        </tbody>
    </table>
}
